[project]
name = "apuntes"
version = "0.1.0"
description = "CLI que organiza apuntes y material de clase con acciones configurables en JSON y ayuda de IA"
readme = "README.md"
license = "MIT"
authors = [
    { name = "Marc Alvear", email = "121582673+marcalvear@users.noreply.github.com" }
]
requires-python = ">=3.12"
dependencies = [
    "anthropic>=2.4.0",
    "google-genai>=2.34.0",
    "pydantic>=2.14.2",
    "python-dotenv>=1.2.4",
    "rich>=15.0.0",
    "send2trash>=2.1.0",
    "typer>=0.27.3",
]

[project.scripts]
apuntes = "apuntes.cli:main"

[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.3",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
